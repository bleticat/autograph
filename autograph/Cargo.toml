[package]
name = "autograph"
version = "0.1.0"
edition = "2024"

[dependencies]
autograph-macros = { path = "../autograph-macros" }
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
