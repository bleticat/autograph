[package]
name = "autograph-tauri"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "autograph"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
autograph-core = { path = "../core" }
time = { version = "0.3.47", features = ["parsing", "formatting"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
